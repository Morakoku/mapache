name: Mapache Scheduler

on:
  schedule:
    # Cada 10 minutos
    - cron: '*/10 * * * *'
  # Permitir ejecución manual
  workflow_dispatch:

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Health check + Alertas
        run: |
          BASE="https://mapache-kappa.vercel.app"
          
          # 1. Verificar salud de servicios
          echo "=== Health Check ==="
          STATUS=$(curl -s "$BASE/api/v1/control/status")
          echo "$STATUS"
          
          # 2. Obtener métricas
          echo ""
          echo "=== Métricas ==="
          METRICS=$(curl -s "$BASE/api/v1/control/metrics")
          echo "$METRICS"
          
          # 3. Enviar alerta si hay problemas (el endpoint ya chequea internamente)
          echo ""
          echo "=== Alertas ==="
          ALERT=$(curl -s "$BASE/api/v1/control/alert")
          echo "$ALERT"
          
          # 4. Trigger scheduler (procesar jobs)
          echo ""
          echo "=== Scheduler Trigger ==="
          TRIGGER=$(curl -s -X POST "$BASE/scheduler/trigger?action=process")
          echo "$TRIGGER"
          
      - name: Log timestamp
        run: echo "Scheduler ejecutado en $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
