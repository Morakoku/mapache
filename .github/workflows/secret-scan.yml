name: Secret Scan (gitleaks)

# Escaneo de secretos ADVISORY: no bloquea merges todavía.
# Motivo: el historial aún contiene un secreto real en
# backend/.env.production.example; se vuelve bloqueante después de purgar el
# historial (ver docs/ROTACION_SECRETOS_2026-09-12.md, tarea de Edwin).
# Cuando el historial esté limpio, quitar `continue-on-error: true`.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos con gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
