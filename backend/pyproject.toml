[project]
name = "crm-backend"
version = "0.1.0"
description = "CRM de prospección, outbound sales y conversión de clientes"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tzdata>=2024.1",          # base de datos IANA de zonas horarias (Windows: ZoneInfo)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Prospección (Fase 2)
    "playwright>=1.49",      # navegador headless del scraper de Google Maps
    "selectolax>=0.3.21",    # parseo HTML rápido del crawler de sitios web
    "phonenumbers>=8.13",    # normalización E.164 con región CO
    "tldextract>=5.1",       # canonicalización de dominios
    "dnspython>=2.7",        # comprobación de registros MX
    # Email (Fase 4)
    "aiosmtplib>=3.0",       # envío SMTP asíncrono
    "aioimaplib>=1.1",       # lectura IMAP de respuestas
    # Inteligencia (Fase 8)
    "anthropic>=0.69",       # SDK oficial de Claude
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    # FastAPI usa llamadas en los defaults (Depends) — es idiomático.
    "B008",
    # Generic[T] en vez de la sintaxis PEP 695: los genéricos de Pydantic v2
    # están mejor probados con la forma clásica. Revisar cuando 3.12 sea el
    # mínimo real en producción.
    "UP046",
]

# TC001/TC002/TC003 (imports solo-para-tipos) quedan fuera del `select` a
# propósito: SQLAlchemy 2.x evalúa las anotaciones `Mapped[...]` en runtime
# para construir el mapeo, y FastAPI hace lo mismo con las de `Depends`.
# Moverlas a un bloque TYPE_CHECKING rompe ambas cosas en tiempo de ejecución.

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]
"tests/*" = ["S101"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false

# Sin stubs publicados. El uso está acotado a `app/mail/smtp.py`.
[[tool.mypy.overrides]]
module = ["aioimaplib.*", "selectolax.*", "tldextract.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un único event loop para toda la sesión: el engine y el pool de asyncpg son
# session-scoped, y una conexión no puede cruzar de un loop a otro.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
