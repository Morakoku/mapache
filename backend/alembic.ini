[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# La URL real la inyecta migrations/env.py desde Settings.
# No poner credenciales aquí.
sqlalchemy.url =

# Nombre de fichero con timestamp: el orden en disco coincide con el
# cronológico, que ayuda cuando hay muchas migraciones.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Sin post_write_hooks: el formateo de las migraciones lo hace `make fmt`,
# que no depende de que alembic resuelva el entrypoint de ruff.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
